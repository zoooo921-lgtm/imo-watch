<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IMO Watch">
<title>IMO Watch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230b3d63'/%3E%3Cpath d='M256 96 L384 240 H312 V400 H200 V240 H128 Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; --accent:#0b3d63; --high:#c0392b; --bg:#f5f7fa; --card:#fff; --text:#1d2430; --muted:#6b7585; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1d232c; --text:#e6eaf0; --muted:#8e99a8; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:var(--accent); color:#fff; padding:14px 16px 10px; padding-top:calc(14px + env(safe-area-inset-top)); }
  h1 { font-size:18px; margin:0 0 2px; }
  #updated { font-size:12px; opacity:.8; }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  input, button { font:inherit; border-radius:8px; border:0; padding:8px 10px; }
  input { flex:1 1 140px; min-width:0; }
  .chips { display:flex; gap:6px; margin-top:8px; overflow-x:auto; }
  .chip { background:rgba(255,255,255,.18); color:#fff; border-radius:999px; padding:5px 12px; white-space:nowrap; cursor:pointer; border:0; font:inherit; }
  .chip.on { background:#fff; color:var(--accent); font-weight:600; }
  #notifyBtn { background:#fff; color:var(--accent); font-weight:600; }
  #notifyBtn[hidden] { display:none; }
  main { padding:12px; display:grid; gap:10px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border-radius:12px; padding:12px 14px; box-shadow:0 1px 2px rgba(0,0,0,.06); border-left:4px solid transparent; }
  .card.high { border-left-color:var(--high); }
  .meta { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .badge { font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px; background:#e4e9f0; color:#333; }
  .badge.high { background:var(--high); color:#fff; }
  .title { margin:6px 0 0; font-size:15px; line-height:1.4; font-weight:600; }
  .title a { color:inherit; text-decoration:none; }
  .note { margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.5; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .foot { text-align:center; font-size:11px; color:var(--muted); padding:16px; }
</style>
</head>
<body>
<header>
  <h1>IMO Watch</h1>
  <div id="updated"></div>
  <div class="controls">
    <input id="q" type="search" placeholder="키워드 검색 (예: MARPOL, 파나마)">
    <button id="notifyBtn" hidden>고우선순위 알림 켜기</button>
  </div>
  <div class="chips" id="flagChips"></div>
  <div class="chips">
    <button class="chip on" data-prio="ALL">전체</button>
    <button class="chip" data-prio="high">고우선순위</button>
  </div>
</header>
<main id="list"></main>
<div class="foot">정보는 각 기관 공식 공지를 요약한 것입니다. 최종 판단은 원문을 확인하세요.</div>

<script>
// 항목 목록. 새 공지가 생기면 이 목록에 객체를 추가하고 파일을 다시 올리면 됩니다.
// priority: "high" (SOLAS, MARPOL 등) 또는 "normal"
const ITEMS = [
  { flag: "IMO", date: "2026-08-24", priority: "high",
    title: "IMO calls for urgent action as piracy resumes in the Gulf of Aden",
    note: "아덴만 해적 활동 재개에 대해 IMO 사무총장이 즉각적 조치와 억류 선원 석방을 요구",
    url: "https://www.imo.org/en/mediacentre/pressbriefings/pages/default.aspx" },
  { flag: "IMO", date: "2026-04-17", priority: "normal",
    title: "IMO approves new guidelines on ship registration",
    note: "IMO 법률위원회가 해적 행위와 깃발 남용을 막기 위한 선박 등록 지침을 승인",
    url: "https://www.imo.org/en/mediacentre/pressbriefings/pages/default.aspx" },
  { flag: "KR", date: "2026-03-24", priority: "normal",
    title: "2028 IGC Code 개정 대비 기술 가이드 발간",
    note: "한국선급이 액화가스 운반선 규칙(IGC Code) 개정 영향을 평가하고 기술 가이드를 공개",
    url: "https://www.krs.co.kr" },
  { flag: "PAN", date: "2026-08-17", priority: "normal",
    title: "MMC-270: 파나마 선박 요구사항 (IMO 번호, VMS·LRIT·AIS 탑재 등)",
    note: "MMC-400을 대체하는 최신 해사회람(Merchant Marine Circular)",
    url: "https://www.panamashipregistry.com/wp-content/uploads/2026/08/MMC-270-17-08-2026.pdf" },
  { flag: "LBR", date: "2026-02-23", priority: "normal",
    title: "LISCR Marine Notices ADM 02/26 (정정본)",
    note: "라이베리아 해사 행정 관련 공지 정정본 (LISCR 온라인 라이브러리)",
    url: "https://www.liscr.com/online-library-official-guidance" },
  { flag: "MHL", date: "2025-05-01", priority: "normal",
    title: "RMI 마린노티스 색인 (Rev. 5/1/2025)",
    note: "마셜제도 해사청(MI)의 현행 마린노티스 목록. 최신 공지는 색인에서 확인",
    url: "https://www.register-iri.com/wp-content/uploads/Index-Marine-Notices.pdf" },
  { flag: "KR-MOF", date: "2026-10-21", priority: "normal",
    title: "제41차 해양사고방지 세미나 개최 (11월 5일, 부산)",
    note: "해양수산부가 선내 배터리 화재, 고위험 어선 관리 등 해양안전 현안을 논의하는 세미나 개최",
    url: "https://www.korea.kr/news/ministryNewsList.do?repCode=A00023" },
];

const SEEN_KEY = "imowatch.single.seen";
const state = { flag: "ALL", prio: "ALL", q: "" };
const $ = (s) => document.querySelector(s);
const seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"));

function init() {
  // 높은 우선순위는 제목에 SOLAS, MARPOL 등이 있으면 자동으로 표시
  const RE = /SOLAS|MARPOL|URGENT|EMERGENC|DETENTION|MANDATORY|PIRACY|SANCTION/i;
  ITEMS.forEach((it) => { if (RE.test(it.title)) it.priority = "high"; });
  ITEMS.sort((a, b) => b.date.localeCompare(a.date));
  $("#updated").textContent = "정리 기준: " + ITEMS[0].date + " 최신 항목";
  buildFlagChips();
  render();
  setupNotify();
  notifyHigh();
}

function buildFlagChips() {
  const flags = ["ALL", ...new Set(ITEMS.map((i) => i.flag))];
  const box = $("#flagChips");
  box.replaceChildren();
  for (const f of flags) {
    const b = document.createElement("button");
    b.className = "chip" + (state.flag === f ? " on" : "");
    b.textContent = f === "ALL" ? "모든 기관" : f;
    b.onclick = () => { state.flag = f; buildFlagChips(); render(); };
    box.appendChild(b);
  }
}

function matches(it) {
  if (state.flag !== "ALL" && it.flag !== state.flag) return false;
  if (state.prio !== "ALL" && it.priority !== state.prio) return false;
  if (state.q && !(it.title + " " + it.note).toLowerCase().includes(state.q)) return false;
  return true;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function render() {
  const list = $("#list");
  list.replaceChildren();
  const items = ITEMS.filter(matches);
  if (!items.length) { list.appendChild(el("p", "empty", "조건에 맞는 항목이 없습니다.")); return; }
  for (const it of items) {
    const card = el("article", "card" + (it.priority === "high" ? " high" : ""));
    const meta = el("div", "meta");
    meta.appendChild(el("span", "badge", it.flag));
    if (it.priority === "high") meta.appendChild(el("span", "badge high", "HIGH"));
    meta.appendChild(el("span", null, it.date));
    const title = el("h2", "title");
    const a = el("a", null, it.title);
    a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    title.appendChild(a);
    card.append(meta, title, el("p", "note", it.note));
    list.appendChild(card);
  }
}

// 고우선순위 알림: 앱을 열었을 때 새 HIGH 항목을 알림으로 표시 (앱이 닫혀 있을 때는 동작하지 않음)
function notifyHigh() {
  const highs = ITEMS.filter((i) => i.priority === "high");
  const key = (i) => i.title + "|" + i.date;
  if (!seen.size) { highs.forEach((i) => seen.add(key(i))); save(); return; }
  const fresh = highs.filter((i) => !seen.has(key(i)));
  if (fresh.length && "Notification" in window && Notification.permission === "granted") {
    for (const it of fresh.slice(0, 3)) new Notification("[HIGH] " + it.flag, { body: it.title });
  }
  highs.forEach((i) => seen.add(key(i)));
  save();
}

function save() {
  localStorage.setItem(SEEN_KEY, JSON.stringify([...seen].slice(-500)));
}

function setupNotify() {
  if (!("Notification" in window) || Notification.permission === "granted") return;
  const btn = $("#notifyBtn");
  btn.hidden = false;
  btn.onclick = async () => {
    const r = await Notification.requestPermission();
    if (r === "granted") btn.hidden = true;
  };
}

document.querySelectorAll(".chip[data-prio]").forEach((b) => {
  b.onclick = () => {
    state.prio = b.dataset.prio;
    document.querySelectorAll(".chip[data-prio]").forEach((x) => x.classList.toggle("on", x === b));
    render();
  };
});
$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });

init();
</script>
</body>
</html>
